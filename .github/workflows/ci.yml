name: Server CI

on:
  push:
    branches: [ development, main ]
    paths:
      - 'server/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ development, main ]
    paths:
      - 'server/**'
      - '.github/workflows/ci.yml'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Aliare.Weather.Api/Aliare.Weather.Api.csproj

      - name: Restore test dependencies
        run: dotnet restore tests/Aliare.Weather.Api.Tests/Aliare.Weather.Api.Tests.csproj

      - name: Build API
        run: dotnet build src/Aliare.Weather.Api/Aliare.Weather.Api.csproj --no-restore --configuration Release

      - name: Build Tests
        run: dotnet build tests/Aliare.Weather.Api.Tests/Aliare.Weather.Api.Tests.csproj --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test tests/Aliare.Weather.Api.Tests/Aliare.Weather.Api.Tests.csproj --no-build --configuration Release --verbosity normal
